<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="chart-audience-title chart-audience-desc" data-source="示例研究数据（待项目实测校核）" data-chart-kind="bar">
  <title id="chart-audience-title">客群与时段使用需求</title>
  <desc id="chart-audience-desc">示例研究数据（待项目实测校核）。以独立柱状标记比较典型到访场景，不使用连续折线暗示不等间隔时段趋势。</desc>
  <style>
    text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; fill: #17323A; }
    .chart-title { font-size: 34px; font-weight: 700; letter-spacing: 1px; }
    .chart-kicker, .axis-label, .methodology { font-size: 17px; fill: #5C7075; }
    .tick-label { font-size: 15px; fill: #718287; }
    .category-label { font-size: 16px; font-weight: 600; }
    .datum-label { font-size: 16px; font-weight: 700; fill: #9A432B; }
    .datum-bar { fill: #C5653E; }
    .source-note { font-size: 15px; fill: #7B878A; }
  </style>
  <rect width="1200" height="700" fill="#F7F4EE"/>
  <rect x="36" y="28" width="1128" height="644" rx="18" fill="#FFFEFB" stroke="#DDE3DF"/>
  <text class="chart-title" x="72" y="72">客群与时段使用需求</text>
  <text class="chart-kicker" x="72" y="108">典型日分时到访需求 · 单位：人次/日</text>

  <g class="axis" aria-label="到访需求量轴">
    <g class="axis-tick" data-value="0"><line x1="170" y1="560" x2="1100" y2="560" stroke="#9DAAA9" stroke-width="2"/><text class="tick-label" x="150" y="566" text-anchor="end">0</text></g>
    <g class="axis-tick" data-value="1250"><line x1="170" y1="460" x2="1100" y2="460" stroke="#DFE5E2"/><text class="tick-label" x="150" y="466" text-anchor="end">1250</text></g>
    <g class="axis-tick" data-value="2500"><line x1="170" y1="360" x2="1100" y2="360" stroke="#DFE5E2"/><text class="tick-label" x="150" y="366" text-anchor="end">2500</text></g>
    <g class="axis-tick" data-value="3750"><line x1="170" y1="260" x2="1100" y2="260" stroke="#DFE5E2"/><text class="tick-label" x="150" y="266" text-anchor="end">3750</text></g>
    <g class="axis-tick" data-value="5000"><line x1="170" y1="160" x2="1100" y2="160" stroke="#DFE5E2"/><text class="tick-label" x="150" y="166" text-anchor="end">5000</text></g>
    <text class="axis-label" x="104" y="360" text-anchor="middle" transform="rotate(-90 104 360)">需求量（人次/日）</text>
  </g>

  <g class="datum" data-category="工作日上午" data-value="1200" data-unit="人次/日">
    <rect class="datum-bar" data-mark="bar" x="202" y="464" width="96" height="96" rx="8" opacity="0.72"/>
    <text class="datum-label" x="250" y="438" text-anchor="middle">1200人次/日</text>
    <text class="category-label" x="250" y="594" text-anchor="middle">工作日上午</text>
  </g>
  <g class="datum" data-category="工作日午间" data-value="1800" data-unit="人次/日">
    <rect class="datum-bar" data-mark="bar" x="382" y="416" width="96" height="144" rx="8" opacity="0.79"/>
    <text class="datum-label" x="430" y="390" text-anchor="middle">1800人次/日</text>
    <text class="category-label" x="430" y="594" text-anchor="middle">工作日午间</text>
  </g>
  <g class="datum" data-category="工作日傍晚" data-value="3200" data-unit="人次/日">
    <rect class="datum-bar" data-mark="bar" x="562" y="304" width="96" height="256" rx="8" opacity="0.87"/>
    <text class="datum-label" x="610" y="278" text-anchor="middle">3200人次/日</text>
    <text class="category-label" x="610" y="594" text-anchor="middle">工作日傍晚</text>
  </g>
  <g class="datum" data-category="工作日夜间" data-value="2800" data-unit="人次/日">
    <rect class="datum-bar" data-mark="bar" x="742" y="336" width="96" height="224" rx="8" opacity="0.83"/>
    <text class="datum-label" x="790" y="310" text-anchor="middle">2800人次/日</text>
    <text class="category-label" x="790" y="594" text-anchor="middle">工作日夜间</text>
  </g>
  <g class="datum" data-category="周末峰值" data-value="4600" data-unit="人次/日">
    <rect class="datum-bar" data-mark="bar" x="922" y="192" width="96" height="368" rx="8"/>
    <text class="datum-label" x="970" y="170" text-anchor="middle">4600人次/日</text>
    <text class="category-label" x="970" y="594" text-anchor="middle">周末峰值</text>
  </g>

  <text class="methodology" x="72" y="630">口径：按示例研究典型日分时到访需求估算，待项目实测校核</text>
  <line x1="72" y1="648" x2="1128" y2="648" stroke="#E4E8E5"/>
  <text class="source-note" x="72" y="670">示例研究数据（待项目实测校核）</text>
</svg>

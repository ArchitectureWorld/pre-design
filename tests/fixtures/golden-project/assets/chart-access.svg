<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="chart-access-title chart-access-desc" data-source="示例研究数据（待项目实测校核）">
  <title id="chart-access-title">交通可达性与步行服务半径</title>
  <desc id="chart-access-desc">示例研究数据（待项目实测校核）。比较五、十、十五分钟步行等时圈的覆盖人口。</desc>
  <style>
    text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; fill: #17323A; }
    .chart-title { font-size: 34px; font-weight: 700; letter-spacing: 1px; }
    .chart-kicker, .axis-label, .methodology { font-size: 17px; fill: #5C7075; }
    .tick-label { font-size: 15px; fill: #718287; }
    .category-label { font-size: 19px; font-weight: 600; }
    .datum-label { font-size: 20px; font-weight: 700; }
    .source-note { font-size: 15px; fill: #7B878A; }
  </style>
  <rect width="1200" height="700" fill="#F7F4EE"/>
  <rect x="36" y="28" width="1128" height="644" rx="18" fill="#FFFEFB" stroke="#DDE3DF"/>
  <text class="chart-title" x="72" y="72">交通可达性与步行服务半径</text>
  <text class="chart-kicker" x="72" y="108">步行等时圈覆盖人口 · 单位：万人</text>

  <g class="axis" aria-label="覆盖人口量轴">
    <g class="axis-tick" data-value="0"><line x1="170" y1="560" x2="1100" y2="560" stroke="#9DAAA9" stroke-width="2"/><text class="tick-label" x="150" y="566" text-anchor="end">0</text></g>
    <g class="axis-tick" data-value="1"><line x1="170" y1="480" x2="1100" y2="480" stroke="#DFE5E2"/><text class="tick-label" x="150" y="486" text-anchor="end">1</text></g>
    <g class="axis-tick" data-value="2"><line x1="170" y1="400" x2="1100" y2="400" stroke="#DFE5E2"/><text class="tick-label" x="150" y="406" text-anchor="end">2</text></g>
    <g class="axis-tick" data-value="3"><line x1="170" y1="320" x2="1100" y2="320" stroke="#DFE5E2"/><text class="tick-label" x="150" y="326" text-anchor="end">3</text></g>
    <g class="axis-tick" data-value="4"><line x1="170" y1="240" x2="1100" y2="240" stroke="#DFE5E2"/><text class="tick-label" x="150" y="246" text-anchor="end">4</text></g>
    <g class="axis-tick" data-value="5"><line x1="170" y1="160" x2="1100" y2="160" stroke="#DFE5E2"/><text class="tick-label" x="150" y="166" text-anchor="end">5</text></g>
    <text class="axis-label" x="108" y="360" text-anchor="middle" transform="rotate(-90 108 360)">覆盖人口（万人）</text>
  </g>

  <g class="datum" data-category="5分钟" data-value="0.8" data-unit="万人">
    <rect x="250" y="496" width="180" height="64" rx="8" fill="#77A9B4"/>
    <text class="datum-label" x="340" y="478" text-anchor="middle">5分钟　0.8万人</text>
    <text class="category-label" x="340" y="595" text-anchor="middle">日常步行圈</text>
  </g>
  <g class="datum" data-category="10分钟" data-value="2.4" data-unit="万人">
    <rect x="510" y="368" width="180" height="192" rx="8" fill="#397C8A"/>
    <text class="datum-label" x="600" y="350" text-anchor="middle">10分钟　2.4万人</text>
    <text class="category-label" x="600" y="595" text-anchor="middle">邻里步行圈</text>
  </g>
  <g class="datum" data-category="15分钟" data-value="4.7" data-unit="万人">
    <rect x="770" y="184" width="180" height="376" rx="8" fill="#1E5967"/>
    <text class="datum-label" x="860" y="166" text-anchor="middle">15分钟　4.7万人</text>
    <text class="category-label" x="860" y="595" text-anchor="middle">社区服务圈</text>
  </g>

  <text class="methodology" x="72" y="630">口径：按示例研究步行等时圈覆盖人口估算，待项目实测校核</text>
  <line x1="72" y1="648" x2="1128" y2="648" stroke="#E4E8E5"/>
  <text class="source-note" x="72" y="670">示例研究数据（待项目实测校核）</text>
</svg>

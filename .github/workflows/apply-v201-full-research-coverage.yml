name: Apply V2.0.1 Full Research Coverage

on:
  push:
    branches:
      - feat/pre-v2.0.1
    paths:
      - 'scripts/apply-v201-full-research-coverage.mjs'
      - '.github/workflows/apply-v201-full-research-coverage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate all remaining ResearchSpecs and source catalog entries
        run: node scripts/apply-v201-full-research-coverage.mjs

      - name: Verify automatic-first semantics
        run: pnpm verify:automation-semantics

      - name: Run research coverage tests
        run: pnpm test:research

      - name: Typecheck
        run: pnpm typecheck

      - name: Build hierarchical source audit
        run: |
          pnpm build:research-audit
          grep -q '57/57 已映射' research/v2.0.1/source-audit.html
          grep -q 'project-state-store' research/v2.0.1/source-audit.html
          grep -q 'professional-tool-output' research/v2.0.1/source-audit.html

      - name: Run complete regression suite
        run: pnpm test

      - name: Test packed runtime
        run: pnpm test:built

      - name: Verify diff hygiene
        run: git diff --check

      - name: Commit generated research coverage
        run: |
          git config user.name "ArchitectureWorld"
          git config user.email "140295054+ArchitectureWorld@users.noreply.github.com"
          git add research/v2.0.1
          if git diff --cached --quiet; then
            echo "No generated research changes required."
            exit 0
          fi
          git commit -m "feat: complete V2.0.1 57-workflow research coverage"
          git push origin HEAD:feat/pre-v2.0.1

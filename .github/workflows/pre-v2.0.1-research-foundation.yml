name: Pre 2.0.1 Research Foundation

on:
  push:
    branches:
      - feat/pre-v2.0.1
    paths:
      - 'src/research/**'
      - 'research/v2.0.1/**'
      - 'tests/**'
      - 'package.json'
      - 'src/version.ts'
      - 'docs/version-matrix.json'
      - 'docs/VERSIONING.md'
      - 'scripts/verify-alignment-version-consistency-v201.mjs'
      - 'scripts/verify-presentation-contract-lock.mjs'
      - '.github/workflows/pre-v2.0.1-research-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Pre 2.0.1 version authority
        run: pnpm verify:alignment-versions

      - name: Run research foundation tests
        run: pnpm test:research

      - name: Typecheck
        run: pnpm typecheck

  full-regression:
    needs: research-foundation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complete build and regression suite
        run: pnpm test

      - name: Test built and packed package runtime
        run: pnpm test:built

      - name: Verify repository diff hygiene
        run: git diff --check

      - name: Verify clean checkout
        run: |
          if [ -n "$(git status --short)" ]; then
            git status --short
            exit 1
          fi

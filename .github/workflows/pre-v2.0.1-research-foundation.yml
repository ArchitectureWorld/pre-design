name: Pre 2.0.1 Research Foundation

on:
  push:
    branches:
      - feat/pre-v2.0.1
    paths:
      - 'src/research/**'
      - 'src/contracts/**'
      - 'src/runtime/**'
      - 'src/proposals/**'
      - 'src/governance/**'
      - 'research/v2.0.1/**'
      - 'tests/**'
      - 'package.json'
      - 'src/version.ts'
      - 'docs/version-matrix.json'
      - 'docs/VERSIONING.md'
      - 'docs/superpowers/specs/2026-09-12-pre-v2.0.1-source-traceable-research-design.md'
      - 'docs/superpowers/specs/2026-09-12-pre-v2.0.1-automation-policy-overlay-design.md'
      - 'docs/superpowers/plans/2026-09-12-pre-v2.0.1-automation-policy-overlay.md'
      - 'scripts/build-research-source-audit.mjs'
      - 'scripts/verify-v201-automation-semantics.mjs'
      - 'scripts/verify-alignment-version-consistency-v201.mjs'
      - 'scripts/verify-presentation-contract-lock.mjs'
      - '.github/workflows/pre-v2.0.1-research-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Pre 2.0.1 version authority
        run: pnpm verify:alignment-versions

      - name: Enforce automatic-mode invariants
        run: pnpm test:automation-invariants

      - name: Run complete research coverage tests
        run: pnpm test:research

      - name: Typecheck
        run: pnpm typecheck

      - name: Build hierarchical source audit HTML
        run: |
          pnpm build:research-audit
          grep -q 'Chapter → Workflow → ResearchStep → DataPoint → DataSource' research/v2.0.1/source-audit.html
          grep -q '57/57 已映射' research/v2.0.1/source-audit.html
          grep -q 'V2.0.1 Automatic-first 执行边界' research/v2.0.1/source-audit.html
          grep -q 'risk=H' research/v2.0.1/source-audit.html
          grep -q 'project-state-store' research/v2.0.1/source-audit.html
          grep -q 'professional-tool-output' research/v2.0.1/source-audit.html
          grep -q '02-01-S03' research/v2.0.1/source-audit.html
          grep -q 'cn-mnr' research/v2.0.1/source-audit.html
          if grep -q 'ResearchSpec 待映射' research/v2.0.1/source-audit.html; then
            echo 'source audit still contains unmapped workflows'
            exit 1
          fi
          if grep -q '触发后转人工' research/v2.0.1/source-audit.html; then
            echo 'source audit reintroduced manual fallback semantics'
            exit 1
          fi

      - name: Upload source audit HTML
        uses: actions/upload-artifact@v4
        with:
          name: pre-v2.0.1-source-audit
          path: research/v2.0.1/source-audit.html
          if-no-files-found: error
          retention-days: 14

  full-regression:
    needs: research-foundation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complete build and regression suite
        run: pnpm test

      - name: Test built and packed package runtime
        run: pnpm test:built

      - name: Verify repository diff hygiene
        run: git diff --check

      - name: Verify clean checkout
        run: |
          if [ -n "$(git status --short)" ]; then
            git status --short
            exit 1
          fi

# validation-marker: full-research-coverage-20260913

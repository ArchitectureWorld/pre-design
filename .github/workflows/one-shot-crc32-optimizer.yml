name: One-shot CRC32 Optimizer

on:
  push:
    branches:
      - feature/presentation-phase0-foundation-v2.0.0
    paths:
      - '.github/workflows/one-shot-crc32-optimizer.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply table-based CRC32 implementation
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/governance/site-boundary-asset-store.ts')
          text = path.read_text(encoding='utf-8')
          old = '''function crc32(bytes: Uint8Array): number {
            let value = 0xffffffff
            for (const byte of bytes) {
              value ^= byte
              for (let bit = 0; bit < 8; bit += 1) value = (value >>> 1) ^ (value & 1 ? 0xedb88320 : 0)
            }
            return (value ^ 0xffffffff) >>> 0
          }'''
          new = '''const CRC32_TABLE = Uint32Array.from({ length: 256 }, (_, index) => {
            let value = index
            for (let bit = 0; bit < 8; bit += 1) {
              value = (value >>> 1) ^ (value & 1 ? 0xedb88320 : 0)
            }
            return value >>> 0
          })

          function crc32(bytes: Uint8Array): number {
            let value = 0xffffffff
            for (let index = 0; index < bytes.length; index += 1) {
              value = CRC32_TABLE[(value ^ bytes[index]!) & 0xff]! ^ (value >>> 8)
            }
            return (value ^ 0xffffffff) >>> 0
          }'''
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one legacy crc32 implementation')
          path.write_text(text.replace(old, new), encoding='utf-8')

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify large-asset regression
        run: pnpm exec vitest run tests/site-boundary-asset-store.spec.ts --maxWorkers=1

      - name: Typecheck
        run: pnpm typecheck

      - name: Commit optimized implementation
        run: |
          git config user.name 'ArchitectureWorld'
          git config user.email '140295054+ArchitectureWorld@users.noreply.github.com'
          git add src/governance/site-boundary-asset-store.ts
          git commit -m 'perf: optimize PNG CRC32 validation'
          git push origin HEAD:feature/presentation-phase0-foundation-v2.0.0

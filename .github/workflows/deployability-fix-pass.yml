name: Deployability Fix Pass

on:
  push:
    branches:
      - feat/pre-v2.0.0
    paths:
      - 'scripts/apply-outline-singleton-collapse.mjs'
      - '.github/workflows/deployability-fix-pass.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/pre-v2.0.0
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply outline singleton collapse
        run: node scripts/apply-outline-singleton-collapse.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Run outline and standard-project regression set
        run: >-
          pnpm exec vitest run
          tests/presentation-standard-outline-content.spec.ts
          tests/presentation-standard-adapter.spec.ts
          tests/presentation-standard-project-e2e.spec.ts
          tests/presentation-standard-contract.spec.ts
          tests/presentation-projection.spec.ts
          tests/workspace-project-root.spec.ts
          --maxWorkers=1

      - name: Check diff hygiene
        run: git diff --check

      - name: Commit verified fix
        run: |
          git config user.name 'ArchitectureWorld'
          git config user.email '140295054+ArchitectureWorld@users.noreply.github.com'
          git add src tests
          git diff --cached --quiet && exit 0
          git commit -m 'fix: collapse singleton outline subjects'
          git push origin HEAD:feat/pre-v2.0.0

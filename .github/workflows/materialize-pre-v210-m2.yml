name: Materialize and verify Pre 2.1.0 regional OD
on:
  push:
    branches: [v2.1.0]
    paths:
      - '.github/workflows/materialize-pre-v210-m2.yml'
permissions:
  contents: write
  statuses: write
concurrency:
  group: pre-v210-m2-tested-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
      - name: Retrieve and apply hash-locked milestone2 files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pre-v210-m2-verification
          node --input-type=module - <<'JS'
          import {readFileSync,writeFileSync,existsSync,mkdirSync,lstatSync,rmSync} from 'node:fs';
          import {resolve,dirname,relative} from 'node:path';
          import {createHash} from 'node:crypto';
          import {brotliDecompressSync} from 'node:zlib';
          import {execFileSync} from 'node:child_process';
          const root=process.cwd(),repo='ArchitectureWorld/pre-design';
          const hash=(b,alg='sha256')=>createHash(alg).update(b).digest('hex');
          const fail=message=>{throw new Error(message)};
          execFileSync('git',['merge-base','--is-ancestor','c2d7f7e6e4854a4393c6c8dad65cbd1714bcfeae','HEAD']);
          const spec=['557c2428edaaeb0ab4d690cdab629984fec238ae','5179a533fb0aa0e48bcd941a43a376d7311943e9','41526b9220bd102a98282dd45191fd55160daad2','368854fb82587051e81be4261b81b5dc6f34b4ca','c280284e3deefcba600a2d57415ef3653ff779a6','a5369f58f04341f2dd9547f4abf0f79de37cdace','f0be263d9b200f9df4fd989271e0acd68e3df9e7','d1b3ee218a4dff4d29117d2625c2e6fb62a08490','47290e800aea05cba8522a97e989be1e21a3d2e8','bb44c492c777f98b9ec352aad39adffc58c74cdd','d5f0e467d5bc11295efd8c3723450e57d83760f0','3649adab18486e4209c8886e60f3b8c966c60809','2bf5097f9d5dddfaa840961499905a1a4d5e2c40','927c1f68bff16d64a01b47877f69aa8fbc32d7f6'];
          const edits=['bfcb3c6962c92933572ed119e9f906dc742db8ff','6a9e966ed03d62097bda19eed02b9f7a1342b920','f50064152549fbce6fca60882baca2a82c41b481','060dfab267a83698257f794676543b8fe2ab0e4b','b904451e3fcdbcd4785bd471d8e9ae8899928662'];
          const paths=['.github/workflows/pre-v2.1.0.yml','HANDOFF.md','README.md','docs/development/v2.1.0-progress.md','docs/pre-v2.1.0-handoff.md','docs/pre-v2.1.0-milestone2-handoff.md','docs/superpowers/plans/2026-09-24-pre-v210-regional-od.md','examples/research/regional-od.request.json','package.json','research/planning-v1.2/README.md','research/planning-v1.2/catalog-lock.json','scripts/build-research-regional-demo.ts','scripts/verify-regional-audit.ts','scripts/verify-research-v210.mjs','src/commands/register.ts','src/index.ts','src/research-v2/command.ts','src/research-v2/index.ts','src/research-v2/regional-bundle.ts','src/research-v2/regional-command.ts','src/research-v2/regional-od.ts','src/research-v2/regional-render.ts','src/research-v2/regional-schema.ts','src/research-v2/run-store.ts','src/research-v2/specification.ts','tests/built-package.spec.ts','tests/commands.spec.ts','tests/helpers/regional-od-fixture.ts','tests/host-apply.spec.ts','tests/research-v210-audit-bundle.spec.ts','tests/research-v210-od-command.spec.ts','tests/research-v210-regional-od.spec.ts','tests/research-v210-run-store.spec.ts','tests/research-v210-specification.spec.ts'];
          async function unpack(ids,compressedHash,rawHash,maxOutputLength){
            let encoded='';
            for(const id of ids){
              const response=await fetch(`https://api.github.com/repos/${repo}/git/blobs/${id}`,{headers:{Accept:'application/vnd.github+json',Authorization:`Bearer ${process.env.GH_TOKEN}`},signal:AbortSignal.timeout(30000)});
              if(!response.ok)fail(`TRANSFER_FETCH_FAILED:${id}:${response.status}`);
              const record=await response.json();if(record.encoding!=='base64'||typeof record.content!=='string')fail('TRANSFER_BLOB_FORMAT');
              const b=Buffer.from(record.content,'base64');
              if(hash(Buffer.concat([Buffer.from(`blob ${b.length}\0`),b]),'sha1')!==id)fail('TRANSFER_BLOB_HASH');
              encoded+=b.toString('utf8');
            }
            if(!/^[A-Za-z0-9+/]+={0,2}$/u.test(encoded))fail('TRANSFER_ENCODING');
            const compressed=Buffer.from(encoded,'base64');
            if(compressed.toString('base64')!==encoded||hash(compressed)!==compressedHash)fail('TRANSFER_COMPRESSED_HASH');
            const raw=brotliDecompressSync(compressed,{maxOutputLength});if(hash(raw)!==rawHash)fail('TRANSFER_RAW_HASH');
            return {raw,compressed};
          }
          const payload=await unpack(edits,'9e5131d3384f6076f43d802c295fc6074da3dc0df3ba2b4d6f43911ff5739d9d','3bdea4950f15c46e277f4d809d5b6d2511b5548bfa95b6bea3f6b5960b9e3150',512*1024);
          const doc=JSON.parse(payload.raw.toString('utf8'));
          if(doc.schemaVersion!=='pre-v210-m2-transfer.v1'||!Array.isArray(doc.files)||JSON.stringify(doc.files.map(f=>f.path).sort())!==JSON.stringify(paths))fail('TRANSFER_PATH_SET');
          function guard(path){
            if(typeof path!=='string'||path.startsWith('/')||path.includes('\\')||path.split('/').some(p=>!p||p==='.'||p==='..'))fail('TRANSFER_PATH');
            const target=resolve(root,path);if(relative(root,target).startsWith('..'))fail('TRANSFER_ESCAPE');
            let current=root;for(const p of path.split('/')){current=resolve(current,p);if(existsSync(current)&&lstatSync(current).isSymbolicLink())fail('TRANSFER_SYMLINK')}
            return target;
          }
          const writes=[];
          for(const file of doc.files){
            const target=guard(file.path),old=existsSync(target)?readFileSync(target):null;
            if((old===null?null:hash(old))!==file.baseSha256)fail('TRANSFER_BASE_CHANGED:'+file.path);
            let text;
            if(file.baseSha256===null){if(typeof file.content!=='string'||file.edits!==undefined)fail('TRANSFER_CONTENT');text=file.content}
            else{
              if(!Array.isArray(file.edits)||file.content!==undefined)fail('TRANSFER_EDITS');
              const lines=old.toString('utf8').match(/[^\n]*\n|[^\n]+$/gu)??[];let end=0;
              for(const e of file.edits){if(!Number.isInteger(e.start)||!Number.isInteger(e.deleteCount)||e.start<end||e.deleteCount<0||e.start+e.deleteCount>lines.length||!Array.isArray(e.insert)||e.insert.some(s=>typeof s!=='string'))fail('TRANSFER_EDIT');end=e.start+e.deleteCount}
              for(const e of [...file.edits].reverse())lines.splice(e.start,e.deleteCount,...e.insert);
              text=lines.join('');
            }
            const body=Buffer.from(text,'utf8');if(hash(body)!==file.sha256)fail('TRANSFER_OUTPUT_HASH:'+file.path);writes.push({target,body});
          }
          const source=await unpack(spec,'eb2811de023245241493335cbfcd137964049c5a645c732f1f4d23e915e992ca','1ad0d7b0a2b52a84515cd97ab313c5596c0da02bea6175eaf4390d39d99d2a08',2*1024*1024);
          const sourcePath='research/planning-v1.2/unified-data.json.br',sourceTarget=guard(sourcePath);if(existsSync(sourceTarget))fail('TRANSFER_SOURCE_EXISTS');
          writes.push({target:sourceTarget,body:source.compressed});
          for(const w of writes){mkdirSync(dirname(w.target),{recursive:true});writeFileSync(w.target,w.body)}
          const temporary='.github/workflows/materialize-pre-v210-m2.yml';rmSync(temporary);
          execFileSync('git',['add','--',...paths,sourcePath,temporary]);
          writeFileSync('/tmp/pre-v210-m2-verification/changed-paths.json',JSON.stringify([...paths,sourcePath]));
          console.log(JSON.stringify({status:'VERIFIED_TRANSFER_APPLIED',files:writes.length,sourceSha256:hash(source.raw)}));
          JS
          git diff --cached --check
          git write-tree > /tmp/pre-v210-m2-verification/TESTED_TREE.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - run: pnpm install --frozen-lockfile
      - name: Full source lock and conditional routing
        run: pnpm verify:research-v210 2>&1 | tee /tmp/pre-v210-m2-verification/catalog.log
      - name: Focused source and regional execution regression
        run: pnpm test:research-v210 2>&1 | tee /tmp/pre-v210-m2-verification/focused.log
      - name: Typecheck
        run: pnpm typecheck 2>&1 | tee /tmp/pre-v210-m2-verification/typecheck.log
      - name: Build and complete regression
        run: pnpm test 2>&1 | tee /tmp/pre-v210-m2-verification/full.log
      - name: Built package and actual Host regression
        run: pnpm test:built 2>&1 | tee /tmp/pre-v210-m2-verification/built.log
      - name: Offline synthetic audit rehearsal
        run: |
          pnpm exec tsx scripts/build-research-regional-demo.ts 2>&1 | tee /tmp/pre-v210-m2-verification/demo.log
          cp work/research-regional-demo/DEMO.json /tmp/pre-v210-m2-verification/DEMO.json
      - name: Commit only the exact tested tree to v2.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(git write-tree)" = "$(cat /tmp/pre-v210-m2-verification/TESTED_TREE.txt)"
          test "$(git ls-remote origin refs/heads/v2.1.0 | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "feat(v2.1.0): integrate tested source-bound regional OD and replayable audit bundles"
          git push origin HEAD:refs/heads/v2.1.0
          git rev-parse HEAD > /tmp/pre-v210-m2-verification/COMMIT.txt
          test "$(git rev-parse HEAD^{tree})" = "$(cat /tmp/pre-v210-m2-verification/TESTED_TREE.txt)"
          git archive --format=tar HEAD > /tmp/pre-v210-m2-verification/source.tar
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          const sha=readFileSync('/tmp/pre-v210-m2-verification/COMMIT.txt','utf8').trim();
          const response=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${sha}`,{method:'POST',headers:{Accept:'application/vnd.github+json',Authorization:`Bearer ${process.env.GH_TOKEN}`,'Content-Type':'application/json'},body:JSON.stringify({state:'success',context:'Pre 2.1.0 milestone2 tested-tree',description:'Exact tree passed source, focused, typecheck, full, built and offline replay tests',target_url:`https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`})});
          if(!response.ok)throw new Error(`STATUS_WRITE_FAILED:${response.status}`);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pre-v210-milestone2-verification
          path: /tmp/pre-v210-m2-verification/
          retention-days: 14

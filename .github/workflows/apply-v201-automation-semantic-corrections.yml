name: Apply V2.0.1 Automation Semantic Corrections

on:
  push:
    branches:
      - feat/pre-v2.0.1
    paths:
      - 'scripts/apply-v201-automatic-first-research-corrections.mjs'
      - '.github/workflows/apply-v201-automation-semantic-corrections.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0

      - name: Apply automatic-first research corrections
        run: node scripts/apply-v201-automatic-first-research-corrections.mjs

      - name: Verify semantic guard
        run: node scripts/verify-v201-automation-semantics.mjs

      - name: Commit corrected research contracts
        run: |
          if [ -z "$(git status --short research/v2.0.1)" ]; then
            echo "No research contract changes required."
            exit 0
          fi
          git config user.name "ArchitectureWorld"
          git config user.email "140295054+ArchitectureWorld@users.noreply.github.com"
          git add research/v2.0.1/workflow-research-specs*.json
          git commit -m "fix: remove mandatory human checkpoints from V2.0.1 research specs"
          git push origin HEAD:feat/pre-v2.0.1

name: Apply V2.0.1 semantic and audit fix

on:
  push:
    branches:
      - feat/pre-v2.0.1
    paths:
      - '.maintenance/fix-v201-semantic-audit.py'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reviewed semantic and audit transformation
        run: python .maintenance/fix-v201-semantic-audit.py

      - name: Regenerate research specs and audit HTML
        run: |
          node scripts/apply-v201-full-research-coverage.mjs
          node scripts/build-research-source-audit.mjs
          grep -q '为什么选择这个来源' research/v2.0.1/source-audit.html
          grep -q '为什么做这一步' research/v2.0.1/source-audit.html
          grep -q '为什么这样汇总与分析' research/v2.0.1/source-audit.html
          grep -q '来源权威性' research/v2.0.1/source-audit.html
          grep -q '该来源在本 Workflow 中的用途' research/v2.0.1/source-audit.html

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify research and type safety
        run: |
          pnpm test:research
          pnpm typecheck

      - name: Run full regression
        run: |
          pnpm test
          pnpm test:built
          git diff --check

      - name: Commit generated fix and remove temporary applicator
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-v201-semantic-audit-fix.yml .maintenance/fix-v201-semantic-audit.py
          git add scripts/apply-v201-full-research-coverage.mjs scripts/build-research-source-audit.mjs tests/research-all-chapters.spec.ts research/v2.0.1/
          git commit -m 'fix: correct V2.0.1 semantic research audit'
          git push origin HEAD:feat/pre-v2.0.1

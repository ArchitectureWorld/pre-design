name: Bootstrap Presentation Contract 0.1.0

on:
  push:
    branches:
      - feat/presentation-standard-project-v0.1.0-integration
    paths:
      - '.github/workflows/presentation-contract-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Fetch, verify and pack fixed Contract
        run: node scripts/prepare-presentation-contract.mjs --skip-install

      - name: Lock exact tarball dependency
        run: pnpm install --lockfile-only

      - name: Install from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify Contract lock and tarball integrity
        run: pnpm verify:presentation-contract

      - name: Check generated diff
        run: git diff --check

      - name: Commit immutable Contract artifact
        run: |
          git config user.name 'ArchitectureWorld'
          git config user.email '140295054+ArchitectureWorld@users.noreply.github.com'
          git add pnpm-lock.yaml vendor/presentation-contracts/contract-artifact.json
          git add -f vendor/presentation-contracts/architectureworld-presentation-contracts-0.1.0.tgz
          if git diff --cached --quiet; then
            echo 'Contract artifact already matches the fixed commit.'
          else
            git commit -m 'build: pin Presentation contract tarball integrity'
            git push origin HEAD:feat/presentation-standard-project-v0.1.0-integration
          fi

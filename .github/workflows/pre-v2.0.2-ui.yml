name: Pre 2.0.2 UI and UX

on:
  push:
    branches: [pre-V2.0.2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive exact source for review
        run: |
          mkdir -p /tmp/pre-v202-delivery
          git archive --format=tar HEAD > /tmp/pre-v202-delivery/pre-V2.0.2-source.tar
          git rev-parse HEAD > /tmp/pre-v202-delivery/COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pre-V2.0.2-source
          path: /tmp/pre-v202-delivery/
          retention-days: 14
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Offline validation tooling snapshot
        if: github.run_number == 2
        run: |
          mkdir -p /tmp/pre-v202-tooling
          tar -czf /tmp/pre-v202-tooling/node_modules.tar.gz node_modules
          cp "$(command -v node)" /tmp/pre-v202-tooling/node
      - uses: actions/upload-artifact@v4
        if: github.run_number == 2
        with:
          name: pre-v202-offline-validation-tooling
          path: /tmp/pre-v202-tooling/
          retention-days: 1
      - name: UI regressions
        run: pnpm exec vitest run tests/pre-v202-*.spec.* --maxWorkers=1
      - name: Typecheck
        run: pnpm typecheck
      - name: Build and full regression
        run: pnpm test
      - name: Built package regression
        run: pnpm test:built
      - name: Diff hygiene
        run: git diff --check

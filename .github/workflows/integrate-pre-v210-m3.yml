name: Validate and integrate Pre 2.1.0 peer research

on:
  push:
    branches: [v2.1.0]
    paths:
      - '.maintenance/pre-v210-m3/**'
      - '.github/workflows/integrate-pre-v210-m3.yml'

permissions:
  contents: write
  statuses: write

concurrency:
  group: pre-v210-m3-integrate
  cancel-in-progress: false

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm
      - name: Restore exact M2 source from the previously verified transfer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pre-v210-m2-verification
          node --input-type=module <<'JS'
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const response=await fetch('https://api.github.com/repos/ArchitectureWorld/pre-design/contents/.github/workflows/materialize-pre-v210-m2.yml?ref=ea515c3f4c35ad1424c1419097373f1d836dfad4',{headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(30000)});
          if(!response.ok)throw new Error('M2_TRANSFER_READ_FAILED');
          const record=await response.json(),body=Buffer.from(record.content,'base64');
          const blob=createHash('sha1').update(Buffer.concat([Buffer.from(`blob ${body.length}\0`),body])).digest('hex');
          if(blob!=='897ed5f50ba1d3b11d78643cbcdfafa007b09a02')throw new Error('M2_TRANSFER_SOURCE_MISMATCH');
          const text=body.toString('utf8'),marker="          node --input-type=module - <<'JS'\n",start=text.indexOf(marker),end=text.indexOf('          JS\n',start);
          if(start<0||end<0)throw new Error('M2_TRANSFER_SECTION_MISSING');
          let code=text.slice(start+marker.length,end).split('\n').map(line=>line.startsWith('          ')?line.slice(10):line).join('\n');
          const cleanup="const temporary='.github/workflows/materialize-pre-v210-m2.yml';rmSync(temporary);",stage="execFileSync('git',['add','--',...paths,sourcePath,temporary]);";
          if(!code.includes(cleanup)||!code.includes(stage))throw new Error('M2_TRANSFER_CLEANUP_MISMATCH');
          code=code.replace(cleanup,'').replace(stage,"execFileSync('git',['add','--',...paths,sourcePath]);");
          execFileSync(process.execPath,['--input-type=module','-'],{input:code,stdio:['pipe','inherit','inherit'],env:process.env});
          JS
      - name: Apply exact source patch and remove one-time transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pre-v210-m3
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { brotliDecompressSync } from 'node:zlib';
          import { createHash } from 'node:crypto';
          const encoded = Array.from({length:7}, (_,i) => readFileSync(`.maintenance/pre-v210-m3/part-${i}.b64`, 'utf8')).join('');
          const patch = brotliDecompressSync(Buffer.from(encoded, 'base64'));
          if (createHash('sha256').update(patch).digest('hex') !== '082095e226eacc80e3eb424d6b43fc5d2b1d536f1ff0d5931fb3d36dfbadbc2c') throw new Error('PATCH_HASH_MISMATCH');
          writeFileSync('/tmp/pre-v210-m3/implementation.patch', patch);
          JS
          git apply --index --check /tmp/pre-v210-m3/implementation.patch
          git apply --index /tmp/pre-v210-m3/implementation.patch
          echo '659848a17e33435cecb6608892e4e2bfdff962c7faa603b1b7fc0106619b4985  .maintenance/pre-v210-m3/recovery-doc.patch' | sha256sum --check
          git apply --index --check .maintenance/pre-v210-m3/recovery-doc.patch
          git apply --index .maintenance/pre-v210-m3/recovery-doc.patch
          git rm .maintenance/pre-v210-m3/part-*.b64 .maintenance/pre-v210-m3/recovery-doc.patch .github/workflows/integrate-pre-v210-m3.yml
          git diff --cached --check
          git diff --cached --name-only > /tmp/pre-v210-m3/CHANGED_PATHS.txt
          git write-tree > /tmp/pre-v210-m3/TESTED_TREE.txt
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        shell: bash
        run: set -o pipefail; pnpm typecheck 2>&1 | tee /tmp/pre-v210-m3/typecheck.log
      - name: Research tests including source, peer and OD replay
        shell: bash
        run: set -o pipefail; pnpm test:research-v210 2>&1 | tee /tmp/pre-v210-m3/research.log
      - name: Build and full regression
        shell: bash
        run: set -o pipefail; pnpm test 2>&1 | tee /tmp/pre-v210-m3/full.log
      - name: Built package and actual DSH Host
        shell: bash
        run: set -o pipefail; pnpm test:built 2>&1 | tee /tmp/pre-v210-m3/built.log
      - name: Synthetic source to peer analysis to regional OD rehearsal
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/build-peer-research-demo.ts 2>&1 | tee /tmp/pre-v210-m3/demo.log
          cp -r work/research-peer-demo /tmp/pre-v210-m3/synthetic-demo
      - name: Commit and push exactly the verified tree
        shell: bash
        env:
          GIT_AUTHOR_NAME: 'github-actions[bot]'
          GIT_AUTHOR_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
          GIT_COMMITTER_NAME: 'github-actions[bot]'
          GIT_COMMITTER_EMAIL: '41898282+github-actions[bot]@users.noreply.github.com'
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --check
          test "$(git write-tree)" = "$(cat /tmp/pre-v210-m3/TESTED_TREE.txt)"
          test "$(git ls-remote origin refs/heads/v2.1.0 | cut -f1)" = "$GITHUB_SHA"
          git -c user.name="$GIT_AUTHOR_NAME" -c user.email="$GIT_AUTHOR_EMAIL" commit -m "feat(v2.1.0): integrate verified source-bound peer research and regional OD bridge"
          git push origin HEAD:refs/heads/v2.1.0
          git rev-parse HEAD > /tmp/pre-v210-m3/COMMIT.txt
      - name: Publish tested-tree status only after all gates passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const sha = readFileSync('/tmp/pre-v210-m3/COMMIT.txt','utf8').trim();
          const response = await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${sha}`, {
            method:'POST', headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`, Accept:'application/vnd.github+json', 'Content-Type':'application/json'},
            body:JSON.stringify({state:'success', context:'Pre 2.1.0 M3 tested-tree', description:'Exact tree passed typecheck, research, full, built Host and synthetic peer/OD replay', target_url:`https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`})
          });
          if (!response.ok) throw new Error(`STATUS_HTTP_${response.status}`);
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pre-v210-m3-verification
          path: /tmp/pre-v210-m3/
          retention-days: 14

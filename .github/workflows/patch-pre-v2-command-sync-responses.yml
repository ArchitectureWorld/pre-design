name: Patch Pre 2.0.0 Command Sync Responses

on:
  push:
    branches:
      - feat/pre-v2.0.0
    paths:
      - '.github/workflows/patch-pre-v2-command-sync-responses.yml'
      - 'scripts/patch-command-sync-responses.mjs'

permissions:
  contents: write

concurrency:
  group: patch-pre-v2-command-sync-responses
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: feat/pre-v2.0.0
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply deterministic command compatibility patch
        run: node scripts/patch-command-sync-responses.mjs

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify affected command and Windows path tests
        run: pnpm exec vitest run tests/commands.spec.ts tests/site-boundary-command-flow.spec.ts tests/workspace-open-route.spec.ts --maxWorkers=1

      - name: Typecheck
        run: pnpm typecheck

      - name: Commit production fix to existing branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/commands/register.ts
          git commit -m "fix: retain command response compatibility while scheduling sync"
          git push origin HEAD:feat/pre-v2.0.0

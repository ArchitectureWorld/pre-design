name: Pre 2.0.0 Integration

on:
  push:
    branches:
      - feat/pre-v2.0.0
  pull_request:
    paths:
      - 'src/presentation/**'
      - 'src/client/**'
      - 'src/index.ts'
      - 'src/commands/register.ts'
      - 'tests/presentation-standard-*.ts'
      - 'tests/presentation-workspace-*.ts'
      - 'tests/workspace-*.ts'
      - 'tests/workspace-*.tsx'
      - 'tests/direct-start*.ts'
      - 'tests/presentation-build-toolchain.spec.ts'
      - 'tests/built-package.spec.ts'
      - 'tests/built-presentation-runtime.spec.ts'
      - 'scripts/prepare-presentation-contract.mjs'
      - 'scripts/prepare-presentation-contract-runtime-assets.mjs'
      - 'scripts/verify-presentation-contract-lock.mjs'
      - 'scripts/verify-presentation-standard-integration.mjs'
      - 'scripts/verify-alignment-version-consistency.mjs'
      - 'scripts/emit-workspace-compatibility-result.mjs'
      - 'docs/contracts/**'
      - 'docs/superpowers/**'
      - 'docs/architecture/**'
      - 'docs/acceptance/**'
      - 'docs/handoff/**'
      - 'docs/version-matrix.json'
      - 'docs/VERSIONING.md'
      - 'README.md'
      - 'HANDOFF.md'
      - 'handoff/**'
      - 'vendor/presentation-contracts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/presentation-standard-project-integration.yml'

permissions:
  contents: read

concurrency:
  group: pre-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-v2-targeted:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js 24.11.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Pre 2.0.0 version authority
        run: pnpm verify:alignment-versions

      - name: Verify pinned external Contract
        run: pnpm verify:presentation-contract

      - name: Verify native build config loading policy
        run: pnpm exec vitest run tests/presentation-build-toolchain.spec.ts --maxWorkers=1

      - name: Run standard-project and Workspace output tests
        run: pnpm test:presentation-standard

      - name: Typecheck
        run: pnpm typecheck

  workspace-safety:
    name: workspace-safety-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js 24.11.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned external Contract
        run: pnpm verify:presentation-contract

      - name: Run shared Workspace safety tests
        run: pnpm test:workspace-safety

  full-regression:
    needs:
      - pre-v2-targeted
      - workspace-safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js 24.11.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complete build and test suite
        run: pnpm test

      - name: Test built and packed package runtime
        run: pnpm test:built

      - name: Verify repository diff hygiene
        run: git diff --check

      - name: Verify clean checkout
        run: |
          if [ -n "$(git status --short)" ]; then
            git status --short
            exit 1
          fi

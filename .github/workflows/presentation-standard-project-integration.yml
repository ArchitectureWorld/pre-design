name: Pre 2.0.0 Integration

on:
  push:
    branches:
      - feat/pre-v2.0.0
  pull_request:
    paths:
      - 'src/presentation/**'
      - 'src/index.ts'
      - 'src/commands/register.ts'
      - 'tests/presentation-standard-*.ts'
      - 'tests/presentation-build-toolchain.spec.ts'
      - 'scripts/prepare-presentation-contract.mjs'
      - 'scripts/verify-presentation-contract-lock.mjs'
      - 'scripts/verify-presentation-standard-integration.mjs'
      - 'scripts/verify-alignment-version-consistency.mjs'
      - 'docs/contracts/**'
      - 'docs/version-matrix.json'
      - 'docs/VERSIONING.md'
      - 'README.md'
      - 'HANDOFF.md'
      - 'handoff/**'
      - 'vendor/presentation-contracts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/presentation-standard-project-integration.yml'

permissions:
  contents: read

concurrency:
  group: pre-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-v2-targeted:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Pre 2.0.0 version authority
        run: pnpm verify:alignment-versions

      - name: Verify pinned external Contract
        run: pnpm verify:presentation-contract

      - name: Verify native build config loading policy
        run: pnpm exec vitest run tests/presentation-build-toolchain.spec.ts --maxWorkers=1

      - name: Run standard-project output tests
        run: pnpm test:presentation-standard

      - name: Typecheck
        run: pnpm typecheck

  full-regression:
    needs: pre-v2-targeted
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complete build and test suite
        run: pnpm test

      - name: Test built package
        run: pnpm test:built

      - name: Verify repository diff hygiene
        run: git diff --check

name: Presentation Phase 0 Foundation

on:
  push:
    branches:
      - feature/presentation-phase0-foundation-v2.0.0
  pull_request:
    paths:
      - 'src/presentation/**'
      - 'tests/presentation-*.spec.ts'
      - '.github/workflows/presentation-phase0-foundation.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: presentation-phase0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase0-foundation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Phase 0 foundation tests
        run: pnpm exec vitest run tests/presentation-*.spec.ts --maxWorkers=1

      - name: Typecheck
        run: pnpm typecheck

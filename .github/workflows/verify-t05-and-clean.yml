name: Verify T05 visual link acknowledgement and clean temporary workflows
on:
  push:
    branches: [feat/pre-v2.0.0]
    paths: [.github/workflows/verify-t05-and-clean.yml]
permissions:
  contents: write
concurrency:
  group: verify-t05-pre-design
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: T05 targeted red-green regression
        run: pnpm vitest run tests/visual-link-receipt.spec.ts
      - name: Full Pre-design regression and build
        shell: bash
        run: |
          set -euo pipefail
          pnpm build
          pnpm test
          pnpm typecheck
          git diff --check
  publish-clean:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove one-shot workflows and publish cleanup to the same branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch=feat/pre-v2.0.0
          current=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$current" = "$EXPECTED_HEAD" || { echo 'Branch advanced; refusing to overwrite'; exit 1; }
          git rm -f --ignore-unmatch \
            .github/workflows/current-source-snapshot.yml \
            .github/workflows/finalize-current-development.yml \
            .github/workflows/verify-t05-and-clean.yml
          git rm -rf --ignore-unmatch .delivery-v11
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: finalize T05 acknowledgement contract and remove temporary workflows'
          git push origin "HEAD:refs/heads/$branch"

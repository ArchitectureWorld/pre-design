name: Pre V2.0.1 Deployment Diagnostic

on:
  push:
    branches:
      - feat/pre-v2.0.1
    paths:
      - '.github/workflows/pre-v201-deployment-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture full deployment diagnostics
        shell: bash
        run: |
          set +e
          echo '=== test:automation-invariants ===' | tee deployment-diagnostic.txt
          pnpm test:automation-invariants 2>&1 | tee -a deployment-diagnostic.txt
          echo "automation_exit=${PIPESTATUS[0]}" | tee -a deployment-diagnostic.txt
          echo '=== test:research ===' | tee -a deployment-diagnostic.txt
          pnpm test:research 2>&1 | tee -a deployment-diagnostic.txt
          echo "research_exit=${PIPESTATUS[0]}" | tee -a deployment-diagnostic.txt
          echo '=== typecheck ===' | tee -a deployment-diagnostic.txt
          pnpm typecheck 2>&1 | tee -a deployment-diagnostic.txt
          echo "typecheck_exit=${PIPESTATUS[0]}" | tee -a deployment-diagnostic.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: pre-v201-deployment-diagnostic
          path: deployment-diagnostic.txt
          retention-days: 1

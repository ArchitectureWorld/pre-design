name: Materialize and verify native layout library V1
on:
  push:
    branches: [codex/layout-library-v1]
    paths: ['.layout-source/**', '.github/workflows/layout-library-bootstrap.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - name: Verify exact reviewed source and materialize ordinary files
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, re, subprocess
          run=lambda *a: subprocess.check_output(a, text=True).strip()
          base='d60c0507353639251a5ad385d20d533f42e6ae4f'
          assert run('git','rev-parse','HEAD^')==base, 'unexpected staging parent'
          raw=base64.b64decode(''.join(pathlib.Path(f'.layout-source/part-{i}.b64').read_text() for i in range(7)),validate=True)
          assert len(raw)==51896
          assert hashlib.sha256(raw).hexdigest()=='cad3746656cbd39b8766afaacdc5dfe7e6288a5b4c81e5506a0d3274f148973e'
          patch=lzma.decompress(raw,memlimit=256*1024*1024)
          assert len(patch)==188602
          paths=re.findall(r'^diff --git a/(\S+) b/\1$',patch.decode(),re.M)
          assert len(paths)==45 and len(set(paths))==45
          assert all(p.startswith(('web/app/','web/worker/','docs/deployment/layout-library-v1/','docs/superpowers/plans/','scripts/layout-library/')) or p=='.github/workflows/layout-library-ci.yml' for p in paths)
          tmp=pathlib.Path('/tmp/native-layout-reviewed.patch');tmp.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(tmp)],check=True)
          subprocess.run(['git','apply',str(tmp)],check=True)
          p=pathlib.Path('web/app/src/dossier/capability-registry.json');d=json.loads(p.read_text())
          assert not any(s['id']=='V14' for s in d['skills'])
          d['skills'].append({'id':'V14','family':'V','name':'参考样稿解析与模板提炼'})
          d['relations'].extend({'skillId':'V14','sectionId':s['id'],'role':'reference'} for s in d['sections'] if s['id']!='S01.05')
          p.write_text(json.dumps(d,ensure_ascii=False,separators=(',',':'))+'\n')
          paths.append(str(p))
          manifest=''.join(f'{name}\0{hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()}\n' for name in sorted(paths))
          assert hashlib.sha256(manifest.encode()).hexdigest()=='2ecac209023bb0a4924ad42fab4a18a25320645a54776d7a4e5e22f04cbb46d3','source mismatch'
          # Connector installs the final workflow after tests; the runner does not mutate workflows.
          paths.remove('.github/workflows/layout-library-ci.yml')
          subprocess.run(['git','add','--',*paths],check=True)
          subprocess.run(['git','restore','--','.github/workflows/layout-library-ci.yml'],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','feat(layout): integrate native layout library V1, developer workbench and skill-bound project rendering'],check=True)
          subprocess.run(['git','push','origin','HEAD:codex/layout-library-v1'],check=True)
          PY
          mkdir -p "$RUNNER_TEMP/layout-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/layout-evidence/SOURCE_COMMIT.txt"
      - name: Install pinned isolated dependencies
        run: bash scripts/layout-library/ci-install.sh
      - name: Verify actual PostgreSQL, Fastify, scheduler, Chromium and Web build
        run: bash scripts/layout-library/ci-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-layout-bootstrap-verification
          path: ${{ runner.temp }}/layout-evidence/
          retention-days: 7

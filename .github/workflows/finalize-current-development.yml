name: Finalize current development on existing branch
on:
  push:
    branches: [feat/pre-v2.0.0]
    paths: [.github/workflows/finalize-current-development.yml]
permissions:
  contents: write
concurrency:
  group: finalize-pre-design-current-development
  cancel-in-progress: false
jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify current business source before cleanup
        shell: bash
        run: |
          set -euo pipefail
          pnpm build
          pnpm test
          pnpm typecheck
          git diff --check
      - name: Remove one-shot development transport, then push to the same branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch=feat/pre-v2.0.0
          current=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$current" = "$EXPECTED_HEAD" || { echo 'Branch advanced; refusing to overwrite'; exit 1; }
          git rm -f --ignore-unmatch \
            .github/workflows/current-source-snapshot.yml \
            .github/workflows/finalize-current-development.yml
          git rm -rf --ignore-unmatch .delivery-v11
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: remove temporary development snapshot workflow'
          git push origin "HEAD:refs/heads/$branch"

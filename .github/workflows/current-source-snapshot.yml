name: Current source snapshot
on:
  push:
    branches: [feat/pre-v2.0.0]
    paths: [.github/workflows/current-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Archive exact source and dependencies
        shell: bash
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=.tmp -czf "$RUNNER_TEMP/pre-design-source.tar.gz" .
          tar -czf "$RUNNER_TEMP/pre-design-node-modules.tar.gz" node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: pre-design-current-source-with-dependencies
          path: |
            ${{ runner.temp }}/pre-design-source.tar.gz
            ${{ runner.temp }}/pre-design-node-modules.tar.gz
          retention-days: 1

name: Pre direct edit Skill verified delivery
on:
  push:
    branches: [feat/pre-v2.0.0]
    paths: [.github/workflows/direct-edit-skill-delivery.yml, '.delivery-v11/**']
permissions:
  contents: read
concurrency:
  group: pre-skill-v11-delivery
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
      - name: Apply exact reviewed Skill source
        run: python .delivery-v11/apply.py
      - run: pnpm install --frozen-lockfile
      - name: Full build and regression suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp/skill-evidence
          pnpm test 2>&1 | tee .tmp/skill-evidence/full-test.txt
          pnpm typecheck 2>&1 | tee .tmp/skill-evidence/typecheck.txt
          pnpm test:built 2>&1 | tee .tmp/skill-evidence/built-test.txt
          git diff --check
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-direct-edit-skill-evidence
          path: .tmp/skill-evidence/
          retention-days: 7
  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish to the same existing branch only
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch=feat/pre-v2.0.0
          current=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$current" = "$EXPECTED_HEAD" || { echo 'Branch advanced; refusing to overwrite'; exit 1; }
          python .delivery-v11/apply.py
          git diff --check
          git add src/prompts/report-design-skill.ts tests/report-design-skill.spec.ts HANDOFF-2026-09-07.md
          git rm -r .delivery-v11
          git rm .github/workflows/direct-edit-skill-delivery.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: align Pre report Skill with recoverable direct-edit tools'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"

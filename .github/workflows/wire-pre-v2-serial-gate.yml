name: Wire Pre 2.0.0 Serial Automatic Gate

on:
  push:
    branches:
      - feat/pre-v2.0.0
    paths:
      - '.github/workflows/wire-pre-v2-serial-gate.yml'
      - 'scripts/wire-serial-automatic-gate.mjs'

permissions:
  contents: write

concurrency:
  group: wire-pre-v2-serial-gate
  cancel-in-progress: false

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: feat/pre-v2.0.0
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply deterministic runtime wiring
        run: node scripts/wire-serial-automatic-gate.mjs

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify serial Gate behavior and continuous-sync suite
        run: pnpm test:continuous-sync

      - name: Typecheck
        run: pnpm typecheck

      - name: Commit production wiring to existing branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tools/register.ts src/index.ts package.json
          git commit -m "feat: approve Ready Gates after serial automatic workflows"
          git push origin HEAD:feat/pre-v2.0.0

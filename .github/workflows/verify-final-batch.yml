name: Verify final Pre report-skill and visual-receipt batch
on:
  push:
    branches: [feat/pre-v2.0.0]
    paths: [.github/workflows/verify-final-batch.yml]
permissions:
  contents: write
concurrency:
  group: verify-final-pre-design-batch
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run T05 and complete Pre-design regression
        shell: bash
        run: |
          set -euo pipefail
          pnpm vitest run tests/visual-link-receipt.spec.ts tests/report-design-skill.spec.ts
          pnpm build
          pnpm test
          pnpm typecheck
          git diff --check
  publish-clean:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish verified cleanup to the same existing branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch=feat/pre-v2.0.0
          current=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$current" = "$EXPECTED_HEAD" || { echo 'Branch advanced; refusing to overwrite'; exit 1; }
          git rm -f --ignore-unmatch \
            .github/workflows/current-source-snapshot.yml \
            .github/workflows/finalize-current-development.yml \
            .github/workflows/verify-t05-and-clean.yml \
            .github/workflows/verify-final-batch.yml
          git rm -rf --ignore-unmatch .delivery-v11
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: finalize verified Pre report-skill and T05 acknowledgement batch'
          git push origin "HEAD:refs/heads/$branch"

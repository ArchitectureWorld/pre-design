name: Verify native layout library V1
on:
  push:
    branches: [codex/layout-library-v1, codex/web-v210]
    paths:
      - '.github/workflows/layout-library-verify.yml'
      - 'web/app/src/layout-library/**'
      - 'web/app/tests/layout-*'
      - 'web/app/tests/fixtures/reference-pdf.mjs'
      - 'web/app/build-prototype.mjs'
      - 'web/worker/layout-reference*'
      - 'web/worker/model-runtime.mjs'
      - 'web/worker/runtime.mjs'
      - 'web/app/src/skills/layout-reference/**'
      - 'web/app/tests/layout-library/**'
      - 'web/app/tests/workflow-api.test.mjs'
      - 'web/app/src/client-report.mjs'
      - 'scripts/layout-library/**'
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - name: Install pinned dependencies in isolated runner
        run: bash scripts/layout-library/ci-install.sh
      - name: Install CJK fonts and PDF text extractor for true legacy regression
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils fonts-noto-cjk
          fc-cache -f >/dev/null
          fc-match 'Noto Sans CJK SC'
          command -v pdftotext
      - name: Verify PostgreSQL, Fastify, visual rendering and Web regressions
        run: bash scripts/layout-library/ci-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-layout-staging-tests
          path: ${{ runner.temp }}/layout-evidence/
          retention-days: 7
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pack staging working source for independent reproduction
        run: |
          mkdir -p "$RUNNER_TEMP/layout-src"
          tar --exclude=.git --exclude=.layout-source --exclude=node_modules -czf "$RUNNER_TEMP/layout-src/staging-source.tar.gz" .
          sha256sum "$RUNNER_TEMP/layout-src/staging-source.tar.gz" > "$RUNNER_TEMP/layout-src/source.sha256"
          git rev-parse HEAD > "$RUNNER_TEMP/layout-src/SOURCE_COMMIT.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: native-layout-staging-source
          path: ${{ runner.temp }}/layout-src/
          retention-days: 3
